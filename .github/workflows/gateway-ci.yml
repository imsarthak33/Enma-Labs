name: gateway-ci

on:
  push:
    branches: [main]
    paths:
      - "enma-gateway/**"
      - ".github/workflows/gateway-ci.yml"
      - "scripts/security_audit.py"
  pull_request:
    paths:
      - "enma-gateway/**"
      - ".github/workflows/gateway-ci.yml"
      - "scripts/security_audit.py"
  workflow_dispatch:

defaults:
  run:
    working-directory: enma-gateway

concurrency:
  group: gateway-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Lint + Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: enma-gateway/package-lock.json

      - name: Install
        run: npm ci

      - name: ESLint (with security plugin)
        run: npm run lint

      - name: Prettier format check
        run: npm run format:check

      - name: Vitest (coverage)
        run: npm run test:coverage

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gateway-coverage
          path: enma-gateway/coverage
          if-no-files-found: ignore

  security-audit:
    name: Security audit (20-item)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run security audit
        run: python scripts/security_audit.py

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build dev image
        uses: docker/build-push-action@v6
        with:
          context: enma-gateway
          file: enma-gateway/Dockerfile
          target: dev
          push: false
          load: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build prod image
        uses: docker/build-push-action@v6
        with:
          context: enma-gateway
          file: enma-gateway/Dockerfile
          target: prod
          push: false
          load: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

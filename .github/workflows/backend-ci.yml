name: backend-ci

on:
  push:
    branches: [main]
    paths:
      - "enma-backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "enma-backend/**"
      - ".github/workflows/backend-ci.yml"
  workflow_dispatch:

defaults:
  run:
    working-directory: enma-backend

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-type:
    name: Lint + Type-check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: enma-backend/pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff (lint)
        run: ruff check .

      - name: Ruff (format check)
        run: ruff format --check .

      - name: mypy (strict)
        run: mypy app

  test:
    name: Tests + Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: timescale/timescaledb-ha:pg16
        env:
          POSTGRES_USER: enma
          POSTGRES_PASSWORD: dev_password
          POSTGRES_DB: enma_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U enma -d enma_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      ENV: test
      LOG_LEVEL: warning
      DATABASE_URL: postgresql+asyncpg://enma:dev_password@localhost:5432/enma_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: enma-backend/pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Initialize Postgres extensions
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client
          PGPASSWORD=dev_password psql -h localhost -U enma -d enma_test \
            -f ../scripts/init-extensions.sql

      - name: pytest
        run: pytest

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: enma-backend/coverage.xml
          if-no-files-found: ignore

  security-audit:
    name: Security audit (20-item)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run security audit
        run: python scripts/security_audit.py

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build dev image
        uses: docker/build-push-action@v6
        with:
          context: enma-backend
          file: enma-backend/Dockerfile
          target: dev
          push: false
          load: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build prod image
        uses: docker/build-push-action@v6
        with:
          context: enma-backend
          file: enma-backend/Dockerfile
          target: prod
          push: false
          load: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

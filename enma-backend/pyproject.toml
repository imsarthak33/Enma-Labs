[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "enma-backend"
version = "0.1.0"
description = "Enma Labs backend — autonomous CA workflow engine."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "Proprietary" }
authors = [{ name = "Enma Labs" }]

dependencies = [
    "fastapi>=0.110.0,<0.112.0",
    "uvicorn[standard]>=0.29.0,<0.31.0",
    "gunicorn>=22.0.0,<23.0.0",
    "sqlalchemy[asyncio]>=2.0.30,<2.1.0",
    "asyncpg>=0.29.0,<0.32.0",
    "alembic>=1.13.0,<1.14.0",
    "pgvector>=0.3.0,<0.4.0",
    "httpx>=0.27.0,<0.28.0",
    "pydantic>=2.7.0,<3.0.0",
    "pydantic-settings>=2.2.0,<2.4.0",
    "python-multipart>=0.0.9,<0.1.0",
    "sentry-sdk[fastapi]>=2.0.0,<3.0.0",
    "structlog>=24.1.0,<25.0.0",
    "orjson>=3.10.0,<4.0.0",
    "pypdf>=4.2.0,<6.0.0",
    "pymupdf>=1.24.0,<2.0.0",
    # Phase 8 — caching + rate limiting
    "redis>=5.0.0,<6.0.0",
    "slowapi>=0.1.9,<0.2.0",
    # W4 — at-rest credential encryption for multi-channel WhatsApp tokens
    "cryptography>=42.0.0,<44.0.0",
    # P1 Brain Ingestion — XXE-safe parsing of user-supplied Tally XML
    "defusedxml>=0.7.1,<0.8.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4.0,<0.6.0",
    "mypy>=1.8.0,<2.0.0",
    "pytest>=8.0.0,<9.0.0",
    "pytest-asyncio>=0.23.0,<0.24.0",
    "pytest-cov>=5.0.0,<6.0.0",
    "testcontainers[postgres]>=4.5.0,<5.0.0",
    "aiosqlite>=0.20.0,<0.21.0",
    "types-requests",
    "types-defusedxml",  # type stubs for the Tally XML parser (P1 ingestion)
    "fakeredis>=2.23.0,<3.0.0",  # in-memory Redis for offline cache tests
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
exclude = ["tests*", "migrations*"]

# ---------------------------------------------------------------------------
# Ruff — linter + formatter. Production-strict rule set.
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py311"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "S",   # bandit (security)
    "ASYNC", # async best practices
    "C4",  # comprehensions
    "SIM", # simplify
    "RUF", # ruff-specific
    "PL",  # pylint
    "TID", # tidy imports
]
ignore = [
    "S101",   # assert used — fine in tests
    "PLR0913", # too-many-arguments — FastAPI handlers need many
    "PLR2004", # magic-value comparison — too noisy for HTTP status codes
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "PLR2004"]
"migrations/**" = ["E501", "S"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ---------------------------------------------------------------------------
# mypy — strict mode. Every public surface is typed.
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.13"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["pgvector.*", "testcontainers.*", "aiosqlite.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=app",
    "--cov-report=term-missing",
    "--cov-report=xml",
    "--cov-fail-under=80",
]
markers = [
    "integration: requires a real Postgres instance (testcontainers)",
    "security: tenant-isolation / multi-tenant boundary tests",
]

[tool.coverage.run]
branch = true
source = ["app"]
omit = ["app/__init__.py", "migrations/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
